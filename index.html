<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f1ea">
<title>Brunna Andrade · Extensão de Cílios</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  /* Paleta refinada — papel, vinho discreto, champagne */
  --paper:        #f5f1ea;
  --paper-warm:   #ebe3d3;

  --wine:         #4a1f28;
  --wine-deep:    #2e1219;

  --champagne:    #e8d4c0;
  --champagne-deep: #c9a98a;
  --rose-nude:    #e0b8a8;

  --gold:         #b89456;

  --ink:          #1a1414;
  --ink-soft:     #4a3838;
  --ink-mute:     #8a7575;

  --white:        #ffffff;

  --font-display: 'Cormorant', 'Times New Roman', serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;

  --ease:         cubic-bezier(0.32, 0.72, 0, 1);
  --ease-out:     cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring:  cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100%;
}

body {
  min-height: 100vh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  position: relative;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, var(--paper) 0%, var(--paper-warm) 100%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.35;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.32  0 0 0 0.04 0'/></filter><rect width='100%25' height='100%25' filter='url(%23p)'/></svg>");
}

.app {
  position: relative;
  z-index: 2;
  max-width: 460px;
  margin: 0 auto;
  padding: 44px 22px 44px;
}

/* ============================================================
   HEADER
   ============================================================ */
.header {
  text-align: center;
  margin-bottom: 32px;
  opacity: 0;
  animation: fade-up 0.9s var(--ease-out) 0.1s forwards;
}

.header .mark {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.header .mark span { display: block; width: 24px; height: 1px; background: var(--gold); }
.header .mark .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }

.header h1 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(36px, 10vw, 48px);
  letter-spacing: 0.005em;
  color: var(--wine-deep);
  line-height: 1;
}
/* Detalhe caligráfico — primeira letra ligeiramente maior */
.header h1 .first {
  font-size: 1.15em;
  font-weight: 400;
  font-style: italic;
  letter-spacing: -0.02em;
}

.header .sub {
  margin-top: 12px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

/* ============================================================
   HERO — wrapper com halo champagne respirando
   ============================================================ */
.hero-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5;
  opacity: 0;
  animation: fade-up 1s var(--ease-out) 0.3s forwards;
}

/* === HALO CHAMPAGNE — luz respirando === */
.halo {
  position: absolute;
  inset: -32px;
  pointer-events: none;
  z-index: 1;
  border-radius: 50%;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(232, 212, 192, 0.45), transparent 55%),
    radial-gradient(ellipse at 70% 70%, rgba(224, 184, 168, 0.4), transparent 55%),
    radial-gradient(ellipse at 50% 50%, rgba(201, 169, 138, 0.25), transparent 70%);
  filter: blur(28px);
  animation: breathe 8s ease-in-out infinite;
}
.halo::before, .halo::after {
  content: "";
  position: absolute;
  inset: 10%;
  border-radius: 50%;
  filter: blur(20px);
}
.halo::before {
  background: radial-gradient(ellipse at 80% 20%, rgba(224, 184, 168, 0.55), transparent 60%);
  animation: orbit-a 18s ease-in-out infinite;
}
.halo::after {
  background: radial-gradient(ellipse at 20% 80%, rgba(232, 212, 192, 0.5), transparent 60%);
  animation: orbit-b 22s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.85; transform: scale(1); }
  50%      { opacity: 1;    transform: scale(1.04); }
}
@keyframes orbit-a {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  33%      { transform: translate(-8px, 6px) rotate(120deg); }
  66%      { transform: translate(6px, -8px) rotate(240deg); }
}
@keyframes orbit-b {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  33%      { transform: translate(8px, -6px) rotate(-120deg); }
  66%      { transform: translate(-6px, 8px) rotate(-240deg); }
}

.hero {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 22px;
  overflow: hidden;
  background: var(--champagne);
  box-shadow:
    0 30px 60px -25px rgba(74, 31, 40, 0.35),
    0 0 0 0.5px rgba(74, 31, 40, 0.08);
  z-index: 2;
}

/* Borda interna sutil dourada */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  border-radius: 22px;
  box-shadow: inset 0 0 0 1px rgba(184, 148, 86, 0.18);
}

/* Vinheta de profundidade */
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  background: linear-gradient(180deg,
    rgba(26, 20, 20, 0.0) 60%,
    rgba(26, 20, 20, 0.3) 100%);
}

/* === STAGE de slides — empilhados, controle manual de transição === */
.stage {
  position: absolute;
  inset: 0;
}
.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity, filter, clip-path;
}
.slide.active {
  opacity: 1;
  pointer-events: auto;
  z-index: 2;
}
.slide img, .slide svg.painting-slide {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  user-select: none;
}

/* === TRANSIÇÕES (aplicadas via JS adicionando classes) === */

/* SAIR — fade + zoom out */
.slide.exit-fade-zoom { animation: exit-fade-zoom 0.9s var(--ease) forwards; }
@keyframes exit-fade-zoom {
  to { opacity: 0; transform: scale(1.08); filter: blur(4px); }
}
/* ENTRAR — fade + zoom in */
.slide.enter-fade-zoom { animation: enter-fade-zoom 0.9s var(--ease) forwards; }
@keyframes enter-fade-zoom {
  from { opacity: 0; transform: scale(1.08); filter: blur(4px); }
  to   { opacity: 1; transform: scale(1);    filter: blur(0);   }
}

/* SAIR — cortina sobe (revela embaixo) */
.slide.exit-curtain { animation: exit-curtain 1s var(--ease) forwards; }
@keyframes exit-curtain {
  to { clip-path: inset(100% 0 0 0); }
}
/* ENTRAR — sob a cortina */
.slide.enter-curtain { animation: enter-curtain 1s var(--ease) forwards; opacity: 1; }
@keyframes enter-curtain {
  from { transform: scale(1.05); }
  to   { transform: scale(1); }
}

/* SAIR — dissolve em pó (blur intenso + fade) */
.slide.exit-dissolve { animation: exit-dissolve 1.1s var(--ease) forwards; }
@keyframes exit-dissolve {
  50%  { opacity: 0.5; filter: blur(8px) brightness(1.2); }
  to   { opacity: 0; filter: blur(20px) brightness(1.4); transform: scale(1.05); }
}
.slide.enter-dissolve { animation: enter-dissolve 1.1s var(--ease) forwards; }
@keyframes enter-dissolve {
  from { opacity: 0; filter: blur(20px) brightness(1.3); transform: scale(0.96); }
  50%  { opacity: 0.5; filter: blur(6px); }
  to   { opacity: 1; filter: blur(0); transform: scale(1); }
}

/* SAIR — slide horizontal */
.slide.exit-slide { animation: exit-slide 0.85s var(--ease) forwards; }
@keyframes exit-slide {
  to { transform: translateX(-30%); opacity: 0; }
}
.slide.enter-slide { animation: enter-slide 0.85s var(--ease) forwards; }
@keyframes enter-slide {
  from { transform: translateX(100%); opacity: 1; }
  to   { transform: translateX(0); opacity: 1; }
}

/* SAIR — flip vertical */
.slide.exit-flip { animation: exit-flip 1s var(--ease) forwards; transform-origin: center; }
@keyframes exit-flip {
  to { transform: perspective(1200px) rotateX(-90deg) scale(0.9); opacity: 0; }
}
.slide.enter-flip { animation: enter-flip 1s var(--ease) forwards; transform-origin: center; }
@keyframes enter-flip {
  from { transform: perspective(1200px) rotateX(90deg) scale(0.9); opacity: 0; }
  to   { transform: perspective(1200px) rotateX(0) scale(1); opacity: 1; }
}

/* SAIR — split (parte de cima sobe, parte de baixo desce) */
.slide.exit-split { animation: exit-split 1s var(--ease) forwards; }
@keyframes exit-split {
  to { clip-path: polygon(0 0, 100% 0, 100% 0, 0 0); transform: translateY(-20%); opacity: 0; }
}
.slide.enter-split { animation: enter-split 1s var(--ease) forwards; }
@keyframes enter-split {
  from { transform: scale(1.1); opacity: 0.7; }
  to   { transform: scale(1); opacity: 1; }
}

/* Indicadores iOS */
.dots {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  z-index: 5;
}
.dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.5);
  transition: all 0.4s var(--ease);
}
.dot.active {
  background: var(--white);
  width: 18px;
  border-radius: 100px;
}

/* Setinhas de navegação invisíveis (área de toque) */
.nav-arrow {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 30%;
  z-index: 5;
  background: transparent;
  border: none;
  cursor: pointer;
  outline: none;
}
.nav-arrow.prev { left: 70px; } /* não sobrepor os links */
.nav-arrow.next { right: 0; }

/* Monograma BA — assinatura do artista */
.monogram {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 5;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 0.5px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  font-family: var(--font-display);
  font-weight: 500;
  font-style: italic;
  font-size: 14px;
  color: var(--white);
  letter-spacing: -0.05em;
  pointer-events: none;
}

/* ============================================================
   LINKS — coluna à esquerda, iOS glass
   ============================================================ */
.links {
  position: absolute;
  top: 50%;
  left: 16px;
  transform: translateY(-50%);
  z-index: 6;
  display: flex;
  flex-direction: column;
  gap: 11px;
  align-items: flex-start;
}

.link-pill {
  display: inline-flex;
  align-items: center;
  gap: 0;
  padding: 0;
  width: 48px;
  height: 48px;
  border-radius: 100px;
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 0.5px solid rgba(255, 255, 255, 0.55);
  box-shadow:
    0 4px 12px rgba(74, 31, 40, 0.18),
    0 1px 3px rgba(74, 31, 40, 0.1);
  text-decoration: none;
  color: var(--ink);
  overflow: hidden;
  white-space: nowrap;
  cursor: pointer;
  opacity: 0;
  transform: translateX(-12px);
  animation: slide-in 0.7s var(--ease-out) forwards;
  transition:
    width 0.55s var(--ease),
    padding 0.55s var(--ease),
    gap 0.55s var(--ease),
    background 0.35s var(--ease),
    box-shadow 0.4s var(--ease),
    transform 0.3s var(--ease-out);
}

.link-pill:nth-child(1) { animation-delay: 0.6s; }
.link-pill:nth-child(2) { animation-delay: 0.7s; }
.link-pill:nth-child(3) { animation-delay: 0.8s; }
.link-pill:nth-child(4) { animation-delay: 0.9s; }
.link-pill:nth-child(5) { animation-delay: 1.0s; }
.link-pill:nth-child(6) { animation-delay: 1.1s; }

.link-pill:hover,
.link-pill.open,
.link-pill:focus-visible {
  width: 240px;
  padding: 0 18px 0 0;
  gap: 12px;
  background: rgba(255, 255, 255, 0.96);
  box-shadow:
    0 10px 28px rgba(74, 31, 40, 0.28),
    0 2px 6px rgba(74, 31, 40, 0.15);
}

.link-pill:active { transform: translateX(0) scale(0.97); }

.link-pill .icon-wrap {
  flex-shrink: 0;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 50%;
}
.link-pill .icon-wrap img,
.link-pill .icon-wrap svg { width: 22px; height: 22px; display: block; }

.link-pill .text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity 0.3s var(--ease) 0.15s, transform 0.4s var(--ease) 0.15s;
}
.link-pill:hover .text,
.link-pill.open .text,
.link-pill:focus-visible .text { opacity: 1; transform: translateX(0); }

.link-pill .label {
  font-weight: 600;
  font-size: 13px;
  color: var(--ink);
  line-height: 1.15;
  letter-spacing: -0.01em;
}
.link-pill .sub {
  font-weight: 400;
  font-size: 11px;
  color: var(--ink-mute);
  line-height: 1.15;
  margin-top: 2px;
}

.link-pill.primary {
  background: var(--wine);
  border-color: rgba(255, 255, 255, 0.18);
}
.link-pill.primary:hover, .link-pill.primary.open { background: var(--wine); }
.link-pill.primary .label { color: var(--paper); }
.link-pill.primary .sub { color: var(--champagne); }

/* ============================================================
   RODAPÉ
   ============================================================ */
.foot {
  margin-top: 36px;
  text-align: center;
  opacity: 0;
  animation: fade-up 0.9s var(--ease-out) 1.3s forwards;
}
.foot .ornament {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  color: var(--gold);
  opacity: 0.7;
}
.foot .ornament span { width: 20px; height: 1px; background: currentColor; }
.foot .ornament svg { width: 10px; height: 10px; }
.foot .meta {
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  opacity: 0.65;
}

@keyframes fade-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slide-in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

@media (max-width: 380px) {
  .app { padding: 32px 14px 32px; }
  .link-pill { width: 44px; height: 44px; }
  .link-pill .icon-wrap { width: 44px; height: 44px; }
  .link-pill:hover, .link-pill.open { width: 215px; }
  .links { left: 12px; gap: 9px; }
  .halo { inset: -24px; }
  .nav-arrow.prev { left: 60px; }
}

.painting-slide { width: 100%; height: 100%; }
</style>
</head>
<body>

<main class="app">

  <header class="header">
    <div class="mark" aria-hidden="true">
      <span></span>
      <div class="dot"></div>
      <span></span>
    </div>
    <h1><span class="first">B</span>runna Andrade</h1>
    <p class="sub">Extensão de Cílios</p>
  </header>

  <div class="hero-wrap">
    <!-- Halo champagne -->
    <div class="halo" aria-hidden="true"></div>

    <section class="hero">
      <!-- Stage de slides -->
      <div class="stage" id="stage">

        <div class="slide active" data-idx="0">
          <svg class="painting-slide" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="p1"><feTurbulence type="turbulence" baseFrequency="0.025" numOctaves="3" seed="2"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
              <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6b3340"/><stop offset="100%" stop-color="#2e1219"/></linearGradient>
            </defs>
            <rect width="400" height="500" fill="url(#g1)"/>
            <g filter="url(#p1)" opacity="0.4">
              <ellipse cx="280" cy="180" rx="180" ry="100" fill="#b89456"/>
              <ellipse cx="150" cy="380" rx="130" ry="80" fill="#4a1f28"/>
            </g>
          </svg>
        </div>

        <div class="slide" data-idx="1">
          <svg class="painting-slide" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="p2"><feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" seed="5"/><feDisplacementMap in="SourceGraphic" scale="18"/></filter>
            </defs>
            <rect width="400" height="500" fill="#ede5d5"/>
            <g filter="url(#p2)" opacity="0.85">
              <path d="M250,0 Q300,100 280,200 Q260,280 320,380 Q360,450 400,500 L400,0 Z" fill="#2a4a6e"/>
              <ellipse cx="350" cy="250" rx="80" ry="120" fill="#1e3550"/>
            </g>
          </svg>
        </div>

        <div class="slide" data-idx="2">
          <svg class="painting-slide" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="p3"><feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="3" seed="11"/><feDisplacementMap in="SourceGraphic" scale="15"/></filter>
            </defs>
            <rect width="400" height="500" fill="#e8d4c8"/>
            <g filter="url(#p3)" opacity="0.7">
              <ellipse cx="200" cy="250" rx="220" ry="180" fill="#d4a896"/>
              <ellipse cx="320" cy="380" rx="100" ry="80" fill="#6b3340" opacity="0.5"/>
            </g>
          </svg>
        </div>

        <div class="slide" data-idx="3">
          <svg class="painting-slide" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="p4"><feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" seed="8"/><feDisplacementMap in="SourceGraphic" scale="20"/></filter>
              <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a3a4a"/><stop offset="100%" stop-color="#1a1a26"/></linearGradient>
            </defs>
            <rect width="400" height="500" fill="url(#g4)"/>
            <g filter="url(#p4)" opacity="0.6">
              <ellipse cx="200" cy="200" rx="180" ry="100" fill="#5a5a72"/>
              <ellipse cx="100" cy="400" rx="120" ry="80" fill="#b89456" opacity="0.3"/>
            </g>
          </svg>
        </div>

      </div>

      <!-- Áreas de toque pra navegar -->
      <button class="nav-arrow prev" id="prevArrow" aria-label="Foto anterior"></button>
      <button class="nav-arrow next" id="nextArrow" aria-label="Próxima foto"></button>

      <!-- Monograma -->
      <div class="monogram" aria-hidden="true">BA</div>

      <!-- Links -->
      <nav class="links" id="links" aria-label="Meus links"></nav>

      <!-- Indicadores -->
      <div class="dots" id="dots"></div>
    </section>
  </div>

  <footer class="foot">
    <div class="ornament" aria-hidden="true">
      <span></span>
      <svg viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="1.5"/></svg>
      <span></span>
    </div>
    <p class="meta">© <span id="year"></span> Brunna Andrade</p>
  </footer>

</main>

<script>
const LINKS = [
  { icon: `<svg viewBox="0 0 24 24" fill="#25D366"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.7-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.1c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2 0 1.3.9 2.6 1.1 2.8.1.2 1.8 2.7 4.3 3.8.6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.4-.3zM12 2C6.5 2 2 6.5 2 12c0 1.7.4 3.3 1.2 4.7L2 22l5.4-1.4c1.4.7 2.9 1.1 4.6 1.1 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>`, label: "Agendamento", sub: "WhatsApp", href: "#", primary: true },
  { icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#1a1414" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#1a1414"/></svg>`, label: "Instagram", sub: "@brunnaandrade", href: "#" },
  { icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#4a1f28" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18l-1.5 12.5a2 2 0 0 1-2 1.5h-11a2 2 0 0 1-2-1.5L3 7z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>`, label: "Cílios & Beleza", sub: "Loja", href: "#" },
  { icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#b89456" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c2-4 5.5-7 10-7s8 3 10 7c-2 4-5.5 7-10 7s-8-3-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`, label: "Portfólio", sub: "Trabalhos", href: "#" },
  { icon: `<svg viewBox="0 0 24 24" fill="#1a1414"><path d="M19.6 6.8c-1.5 0-2.9-.7-3.9-1.8-.8-.9-1.3-2.1-1.4-3.4h-3.2v13.1c0 1.5-1.2 2.7-2.7 2.7s-2.7-1.2-2.7-2.7 1.2-2.7 2.7-2.7c.3 0 .6 0 .9.1V8.7c-.3 0-.6-.1-.9-.1C5.1 8.6 2 11.7 2 15.5S5.1 22.4 8.9 22.4s6.9-3.1 6.9-6.9V9.2c1.3.9 2.9 1.5 4.6 1.5V7.5c-.3 0-.5-.3-.8-.7z"/></svg>`, label: "TikTok", sub: "Conteúdo", href: "#" },
];

/* ============================================================
   CARROSSEL — controle manual com loop infinito + transições variadas
   ============================================================ */
const stage = document.getElementById("stage");
const slides = Array.from(stage.querySelectorAll(".slide"));
const dotsEl = document.getElementById("dots");
const total = slides.length;

let current = 0;
let isAnimating = false;

// Cria dots
slides.forEach((_, i) => {
  const dot = document.createElement("span");
  dot.className = "dot" + (i === 0 ? " active" : "");
  dotsEl.appendChild(dot);
});

const TRANSITIONS = [
  "fade-zoom",
  "curtain",
  "dissolve",
  "slide",
  "flip",
  "split",
];

// Sorteio sem repetir a anterior pra ter variedade real
let lastTransition = null;
function pickTransition() {
  let pool = TRANSITIONS.filter(t => t !== lastTransition);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  lastTransition = pick;
  return pick;
}

function goTo(nextIdx) {
  if (isAnimating || nextIdx === current) return;
  isAnimating = true;

  // Loop infinito — normaliza
  nextIdx = ((nextIdx % total) + total) % total;

  const transition = pickTransition();
  const exiting = slides[current];
  const entering = slides[nextIdx];

  // Limpa classes antigas
  slides.forEach(s => {
    s.classList.remove(
      "exit-fade-zoom", "enter-fade-zoom",
      "exit-curtain", "enter-curtain",
      "exit-dissolve", "enter-dissolve",
      "exit-slide", "enter-slide",
      "exit-flip", "enter-flip",
      "exit-split", "enter-split"
    );
  });

  // Prepara o que entra: ativo mas escondido por classe enter
  entering.classList.add("active");
  // Força reflow pra animação disparar
  void entering.offsetWidth;

  entering.classList.add(`enter-${transition}`);
  exiting.classList.add(`exit-${transition}`);

  // Atualiza dots
  document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("active", i === nextIdx));

  // Ao fim, limpa o slide que saiu
  const duration = 1200;
  setTimeout(() => {
    exiting.classList.remove("active");
    slides.forEach(s => {
      s.classList.remove(
        "exit-fade-zoom", "enter-fade-zoom",
        "exit-curtain", "enter-curtain",
        "exit-dissolve", "enter-dissolve",
        "exit-slide", "enter-slide",
        "exit-flip", "enter-flip",
        "exit-split", "enter-split"
      );
    });
    current = nextIdx;
    isAnimating = false;
  }, duration);
}

function next() { goTo(current + 1); }
function prev() { goTo(current - 1); }

// Autoplay com loop infinito
let autoTimer;
let userInteracting = false;
function scheduleAuto() {
  clearTimeout(autoTimer);
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  autoTimer = setTimeout(() => {
    if (!userInteracting) next();
    scheduleAuto();
  }, 5500);
}
scheduleAuto();

document.addEventListener("visibilitychange", () => {
  if (document.hidden) clearTimeout(autoTimer);
  else scheduleAuto();
});

// Setinhas
document.getElementById("nextArrow").addEventListener("click", () => {
  userInteracting = true; next();
  setTimeout(() => userInteracting = false, 3000);
});
document.getElementById("prevArrow").addEventListener("click", () => {
  userInteracting = true; prev();
  setTimeout(() => userInteracting = false, 3000);
});

// Swipe táctil
let touchStartX = 0, touchStartY = 0;
stage.addEventListener("touchstart", (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  userInteracting = true;
}, { passive: true });

stage.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) next();
    else prev();
  }
  setTimeout(() => userInteracting = false, 3000);
}, { passive: true });

stage.addEventListener("mouseenter", () => userInteracting = true);
stage.addEventListener("mouseleave", () => userInteracting = false);

/* ============================================================
   LINKS
   ============================================================ */
const linksEl = document.getElementById("links");
LINKS.forEach((link) => {
  const a = document.createElement("a");
  a.href = link.href;
  a.className = "link-pill" + (link.primary ? " primary" : "");
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", link.label);
  a.innerHTML = `
    <span class="icon-wrap">${link.icon}</span>
    <span class="text">
      <span class="label">${link.label}</span>
      ${link.sub ? `<span class="sub">${link.sub}</span>` : ''}
    </span>
  `;
  let opened = false;
  a.addEventListener("click", (e) => {
    const isTouch = window.matchMedia("(hover: none)").matches;
    if (isTouch && !opened) {
      e.preventDefault();
      document.querySelectorAll(".link-pill.open").forEach(p => p !== a && p.classList.remove("open"));
      a.classList.add("open");
      opened = true;
      setTimeout(() => opened = false, 4000);
    }
  });
  linksEl.appendChild(a);
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".link-pill")) {
    document.querySelectorAll(".link-pill.open").forEach(p => p.classList.remove("open"));
  }
});

document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
